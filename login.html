<script>
  const loginForm = document.getElementById("loginForm");
  const loginMsg = document.getElementById("loginMsg");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      email: loginForm.email.value,
      password: loginForm.password.value,
    };

    try {
      const res = await fetch("http://localhost:5000/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const json = await res.json();

      // 🔥 EMAIL NOT VERIFIED CHECK
      if (json.message === "Please verify your email first") {
        loginMsg.textContent = "Check your email and verify first!";
        loginMsg.style.color = "orange";
        return; // stop execution
      }

      // Default message
      loginMsg.textContent = json.message || "Something went wrong";

      if (res.ok) {
        loginMsg.style.color = "green";

        // Save user
        if (json.user) {
          localStorage.setItem("user", JSON.stringify(json.user));
        }

        // Redirect logic
        const params = new URLSearchParams(window.location.search);
        const redirectPage = params.get("redirect") || "index.html";

        window.location.href = redirectPage;
      } else {
        loginMsg.style.color = "red";
      }
    } catch (err) {
      loginMsg.textContent = "Error: " + err.message;
      loginMsg.style.color = "red";
    }
  });
</script>

<script src="auth.js"></script>
